<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>etkc hero viewer check</title>
<style>
  html, body { margin: 0; height: 100%; background: #060607; overflow: hidden; }
  #info { position: fixed; top: 8px; left: 8px; color: #aaa; font: 12px monospace; z-index: 10; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="info">loading...</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const info = document.getElementById("info");

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060607);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(6.5, 2.4, 7.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;
controls.minDistance = 2;
controls.maxDistance = 15;

// simple ground + soft contact shadow via a dark transparent disc
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(6, 64),
  new THREE.MeshStandardMaterial({ color: 0x0a0a0c, roughness: 0.4, metalness: 0.0 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const key = new THREE.DirectionalLight(0xfff4e6, 1.2);
key.position.set(5, 6, 3);
scene.add(key);
const fill = new THREE.DirectionalLight(0xcfe0ff, 0.4);
fill.position.set(-5, 3, -2);
scene.add(fill);

const modelUrl = new URLSearchParams(location.search).get("model") || "etkc_hero.glb";
const loader = new GLTFLoader();
const t0 = performance.now();
loader.load(modelUrl, (gltf) => {
  const model = gltf.scene;

  // auto-center/scale based on bounding box so it sits on the ground plane
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  model.position.x -= center.x;
  model.position.z -= center.z;
  model.position.y -= box.min.y;

  scene.add(model);
  const dt = ((performance.now() - t0) / 1000).toFixed(2);
  info.textContent = `loaded in ${dt}s | size ${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)} m`;
}, (xhr) => {
  if (xhr.lengthComputable) {
    const pct = (xhr.loaded / xhr.total * 100).toFixed(0);
    info.textContent = `loading... ${pct}% (${(xhr.loaded/1e6).toFixed(1)}MB)`;
  }
}, (err) => {
  info.textContent = "LOAD ERROR: " + err.message;
  console.error(err);
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
